name: Phase Publishing

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum digests to include"
        required: false
        default: ""
      days_back:
        description: "Discovery lookback window"
        required: false
        default: ""
      dry_run:
        description: "Enable dry run mode (true/false)"
        required: false
        default: "true"

concurrency:
  group: phase-publishing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publishing:
    name: Run Publishing Phase
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.11"
      VENV_PATH: .venv
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_REPOSITORY: ${{ secrets.GH_REPOSITORY }}
      DRY_RUN: ${{ github.event.inputs.dry_run != '' && github.event.inputs.dry_run || vars.DRY_RUN || 'true' }}
      LIMIT: ${{ inputs.limit }}
      DAYS_BACK: ${{ inputs.days_back }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure required secrets present
        run: |
          missing=()
          for var in DATABASE_URL OPENAI_API_KEY GH_TOKEN GH_REPOSITORY; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            pip-${{ runner.os }}-

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            venv-${{ runner.os }}-

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/whisper
            ~/.cache/torch
          key: whisper-${{ runner.os }}-${{ env.PYTHON_VERSION }}
          restore-keys: |
            whisper-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [ ! -d "${VENV_PATH}" ]; then
            python -m venv "${VENV_PATH}"
          fi
          source "${VENV_PATH}/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run discovery (seed data)
        run: |
          source "${VENV_PATH}/bin/activate"
          mkdir -p artifacts
          DRY_RUN_FLAG=""
          DRY_VALUE="${DRY_RUN,,}"
          if [[ "$DRY_VALUE" == "true" || "$DRY_VALUE" == "1" || "$DRY_VALUE" == "yes" || "$DRY_VALUE" == "on" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          DISCOVERY_CMD="python scripts/run_discovery.py --verbose --output artifacts/discovery-output.json"
          if [ -n "$LIMIT" ]; then
            DISCOVERY_CMD="$DISCOVERY_CMD --limit \"$LIMIT\""
          fi
          if [ -n "$DAYS_BACK" ]; then
            DISCOVERY_CMD="$DISCOVERY_CMD --days-back \"$DAYS_BACK\""
          fi
          if [ -n "$DRY_RUN_FLAG" ]; then
            DISCOVERY_CMD="$DISCOVERY_CMD $DRY_RUN_FLAG"
          fi
          echo "Running: $DISCOVERY_CMD"
          eval "$DISCOVERY_CMD"
        env:
          ORCHESTRATED_EXECUTION: "1"

      - name: Run audio phase (seed transcripts table)
        run: |
          source "${VENV_PATH}/bin/activate"
          mkdir -p artifacts
          DRY_RUN_FLAG=""
          DRY_VALUE="${DRY_RUN,,}"
          if [[ "$DRY_VALUE" == "true" || "$DRY_VALUE" == "1" || "$DRY_VALUE" == "yes" || "$DRY_VALUE" == "on" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          AUDIO_CMD="python scripts/run_audio.py --verbose --output artifacts/audio-output.json"
          if [ -n "$LIMIT" ]; then
            AUDIO_CMD="$AUDIO_CMD --limit \"$LIMIT\""
          fi
          if [ -n "$DRY_RUN_FLAG" ]; then
            AUDIO_CMD="$AUDIO_CMD $DRY_RUN_FLAG"
          fi
          echo "Running: $AUDIO_CMD"
          eval "$AUDIO_CMD < artifacts/discovery-output.json"
        env:
          ORCHESTRATED_EXECUTION: "1"

      - name: Run scoring phase (seed scoring table)
        run: |
          source "${VENV_PATH}/bin/activate"
          mkdir -p artifacts
          DRY_RUN_FLAG=""
          DRY_VALUE="${DRY_RUN,,}"
          if [[ "$DRY_VALUE" == "true" || "$DRY_VALUE" == "1" || "$DRY_VALUE" == "yes" || "$DRY_VALUE" == "on" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          SCORING_CMD="python scripts/run_scoring.py --verbose --output artifacts/scoring-output.json"
          if [ -n "$LIMIT" ]; then
            SCORING_CMD="$SCORING_CMD --limit \"$LIMIT\""
          fi
          if [ -n "$DRY_RUN_FLAG" ]; then
            SCORING_CMD="$SCORING_CMD $DRY_RUN_FLAG"
          fi
          echo "Running: $SCORING_CMD"
          eval "$SCORING_CMD < artifacts/audio-output.json"
        env:
          ORCHESTRATED_EXECUTION: "1"

      - name: Run digest phase
        run: |
          source "${VENV_PATH}/bin/activate"
          mkdir -p artifacts
          DRY_RUN_FLAG=""
          DRY_VALUE="${DRY_RUN,,}"
          if [[ "$DRY_VALUE" == "true" || "$DRY_VALUE" == "1" || "$DRY_VALUE" == "yes" || "$DRY_VALUE" == "on" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          DIGEST_CMD="python scripts/run_digest.py --verbose --output artifacts/digest-output.json"
          if [ -n "$DRY_RUN_FLAG" ]; then
            DIGEST_CMD="$DIGEST_CMD $DRY_RUN_FLAG"
          fi
          echo "Running: $DIGEST_CMD"
          eval "$DIGEST_CMD"
        env:
          ORCHESTRATED_EXECUTION: "1"

      - name: Run TTS phase
        run: |
          source "${VENV_PATH}/bin/activate"
          mkdir -p artifacts
          DRY_RUN_FLAG=""
          DRY_VALUE="${DRY_RUN,,}"
          if [[ "$DRY_VALUE" == "true" || "$DRY_VALUE" == "1" || "$DRY_VALUE" == "yes" || "$DRY_VALUE" == "on" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          TTS_CMD="python scripts/run_tts.py --verbose --output artifacts/tts-output.json"
          if [ -n "$DRY_RUN_FLAG" ]; then
            TTS_CMD="$TTS_CMD $DRY_RUN_FLAG"
          fi
          echo "Running: $TTS_CMD"
          eval "$TTS_CMD < artifacts/digest-output.json"
        env:
          ORCHESTRATED_EXECUTION: "1"

      - name: Run publishing phase
        run: |
          source "${VENV_PATH}/bin/activate"
          mkdir -p artifacts
          DRY_RUN_FLAG=""
          DRY_VALUE="${DRY_RUN,,}"
          if [[ "$DRY_VALUE" == "true" || "$DRY_VALUE" == "1" || "$DRY_VALUE" == "yes" || "$DRY_VALUE" == "on" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          PUBLISHING_CMD="python scripts/run_publishing.py --verbose --days-back \"30\""
          if [ -n "$DRY_RUN_FLAG" ]; then
            PUBLISHING_CMD="$PUBLISHING_CMD $DRY_RUN_FLAG"
          fi
          echo "Running: $PUBLISHING_CMD"
          eval "$PUBLISHING_CMD > artifacts/publishing-output.json"
        env:
          ORCHESTRATED_EXECUTION: "1"

      - name: Collect publishing artifacts
        if: always()
        run: |
          mkdir -p artifacts/logs
          for pattern in "logs/publishing_*.log" "logs/tts_*.log" "logs/digest_*.log" "logs/scoring_*.log" "logs/audio_*.log" "logs/discovery_*.log"; do
            if compgen -G "$pattern" > /dev/null; then
              cp $pattern artifacts/logs/
            fi
          done

      - name: Upload publishing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publishing-phase
          path: artifacts
          if-no-files-found: warn

      - name: Summarize publishing output
        if: success()
        run: |
          if [ -f artifacts/publishing-output.json ]; then
            tail -n 50 artifacts/publishing-output.json
          else
            echo "publishing-output.json not produced."
          fi
