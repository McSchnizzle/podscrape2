name: Phase TTS

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum digests to include"
        required: false
        default: ""
      days_back:
        description: "Discovery lookback window"
        required: false
        default: ""
      dry_run:
        description: "Enable dry run mode (true/false)"
        required: false
        default: "false"

concurrency:
  group: phase-tts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tts:
    name: Run TTS Phase
    runs-on: ubuntu-latest

    permissions:
      contents: write    # For git push operations
      packages: write    # For GitHub releases

    env:
      PYTHON_VERSION: "3.11"
      VENV_PATH: .venv
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_REPOSITORY: ${{ secrets.GH_REPOSITORY }}
      DRY_RUN: ${{ inputs.dry_run }}
      LIMIT: ${{ inputs.limit }}
      DAYS_BACK: ${{ inputs.days_back }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git for commits
        run: |
          git config --global user.name "Paul Brown"
          git config --global user.email "brownpr0@gmail.com"

      - name: Ensure required secrets present
        run: |
          missing=()
          for var in DATABASE_URL OPENAI_API_KEY GH_TOKEN GH_REPOSITORY; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            pip-${{ runner.os }}-

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            venv-${{ runner.os }}-

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/whisper
            ~/.cache/torch
          key: whisper-${{ runner.os }}-${{ env.PYTHON_VERSION }}
          restore-keys: |
            whisper-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [ ! -d "${VENV_PATH}" ]; then
            python -m venv "${VENV_PATH}"
          fi
          source "${VENV_PATH}/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Discovery
        run: |
          source "${VENV_PATH}/bin/activate"
          mkdir -p artifacts

          DISCOVERY_CMD="python scripts/run_discovery.py --verbose --output artifacts/discovery-output.json"
          if [ -n "$LIMIT" ]; then
            DISCOVERY_CMD="$DISCOVERY_CMD --limit \"$LIMIT\""
          fi
          if [ -n "$DAYS_BACK" ]; then
            DISCOVERY_CMD="$DISCOVERY_CMD --days-back \"$DAYS_BACK\""
          fi

          echo "Running: $DISCOVERY_CMD"
          eval "$DISCOVERY_CMD"
        env:
          ORCHESTRATED_EXECUTION: "1"

      - name: Audio
        run: |
          source "${VENV_PATH}/bin/activate"
          mkdir -p artifacts

          AUDIO_CMD="python scripts/run_audio.py --verbose --output artifacts/audio-output.json"
          if [ -n "$LIMIT" ]; then
            AUDIO_CMD="$AUDIO_CMD --limit \"$LIMIT\""
          fi

          echo "Running: $AUDIO_CMD"
          eval "$AUDIO_CMD < artifacts/discovery-output.json"
        env:
          ORCHESTRATED_EXECUTION: "1"

      - name: Scoring
        run: |
          source "${VENV_PATH}/bin/activate"
          mkdir -p artifacts

          SCORING_CMD="python scripts/run_scoring.py --verbose --output artifacts/scoring-output.json"
          if [ -n "$LIMIT" ]; then
            SCORING_CMD="$SCORING_CMD --limit \"$LIMIT\""
          fi

          echo "Running: $SCORING_CMD"
          eval "$SCORING_CMD < artifacts/audio-output.json"
        env:
          ORCHESTRATED_EXECUTION: "1"

      - name: Digest
        run: |
          source "${VENV_PATH}/bin/activate"
          mkdir -p artifacts
          python scripts/run_digest.py \
            --verbose \
            --output artifacts/digest-output.json
        env:
          ORCHESTRATED_EXECUTION: "1"

      - name: Capture existing MP3 inventory
        id: capture_mp3_baseline
        run: |
          set -euo pipefail
          TARGET_BRANCH=${TARGET_BRANCH:-main}
          source "${VENV_PATH}/bin/activate"
          mkdir -p data/completed-tts/current
          mkdir -p artifacts/tts-persist
          BASELINE=artifacts/tts-persist/before.txt
          find data/completed-tts/current -maxdepth 1 -type f -name '*.mp3' -print | sort > "$BASELINE" || true
          echo "before_file=$(realpath "$BASELINE")" >> "$GITHUB_OUTPUT"

      - name: TTS
        run: |
          source "${VENV_PATH}/bin/activate"
          mkdir -p artifacts
          python scripts/run_tts.py \
            --verbose \
            --output artifacts/tts-output.json \
            < artifacts/digest-output.json
        env:
          ORCHESTRATED_EXECUTION: "1"

      - name: Publishing
        if: success() && inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ secrets.GH_REPOSITORY }}
          TARGET_BRANCH: ${{ github.ref_name }}
          BASELINE_FILE: ${{ steps.capture_mp3_baseline.outputs.before_file }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/tts-persist
          mkdir -p data/completed-tts/current

          if compgen -G "data/completed-tts/*.mp3" > /dev/null; then
            mv data/completed-tts/*.mp3 data/completed-tts/current/ 2>/dev/null || true
          fi

          BASELINE=${BASELINE_FILE:-}
          if [ -z "$BASELINE" ] || [ ! -f "$BASELINE" ]; then
            BASELINE=$(mktemp)
            touch "$BASELINE"
          fi

          AFTER=$(mktemp)
          find data/completed-tts/current -maxdepth 1 -type f -name '*.mp3' -print | sort > "$AFTER"

          NEW_LIST=artifacts/tts-persist/new_files.txt
          comm -13 "$BASELINE" "$AFTER" > "$NEW_LIST"

          if [ ! -s "$NEW_LIST" ]; then
            echo "No new MP3 files detected; skipping persistence."
            exit 0
          fi

          mapfile -t FILES < "$NEW_LIST"
          PRIMARY_FILE=${FILES[0]}
          BASENAME=$(basename "$PRIMARY_FILE")
          DATE_PART=$(echo "$BASENAME" | sed -E 's/.*_([0-9]{8})_[0-9]{6}\.mp3/\1/')
          if [ -z "$DATE_PART" ]; then
            DATE_PART=$(date -u +%Y%m%d)
          fi
          RELEASE_DATE="${DATE_PART:0:4}-${DATE_PART:4:2}-${DATE_PART:6:2}"

          source "${VENV_PATH}/bin/activate"

          echo "Publishing MP3 files to GitHub Release:"
          echo "  Release date: $RELEASE_DATE"
          echo "  Files to publish:"
          for file in "${FILES[@]}"; do
            echo "    - $file ($([ -f "$file" ] && echo "exists" || echo "MISSING"))"
          done

          echo "Creating GitHub Release and uploading MP3 assets..."
          if ! python scripts/publish_release_assets.py --publish-date "$RELEASE_DATE" "${FILES[@]}"; then
            echo "ERROR: Failed to create GitHub Release and upload MP3 files"
            exit 1
          fi

          echo "Verifying GitHub Release was created..."
          sleep 5  # Give GitHub API time to propagate

          echo "Running RSS publishing..."
          python scripts/run_publishing.py --verbose
          cp data/rss/daily-digest.xml data/rss/test-feed.xml
          cp public/daily-digest.xml public/test-feed.xml

          git add data/completed-tts/current/*.mp3 \
            data/rss/daily-digest.xml data/rss/test-feed.xml \
            public/daily-digest.xml public/test-feed.xml
          if git diff --cached --quiet; then
            echo "No repository changes to commit after publishing."
            exit 0
          fi

          COMMIT_MSG="Add TTS audio files - $(date -u +'%Y-%m-%d %H:%M:%S')"
          git commit -m "$COMMIT_MSG"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GH_REPOSITORY}.git" "$TARGET_BRANCH"

      - name: Collect TTS logs and MP3 files
        if: always()
        run: |
          mkdir -p artifacts/logs
          for pattern in "logs/tts_*.log" "logs/digest_*.log" "logs/scoring_*.log" "logs/audio_*.log" "logs/discovery_*.log"; do
            if compgen -G "$pattern" > /dev/null; then
              cp $pattern artifacts/logs/
            fi
          done
          # Copy generated MP3 files to artifacts
          mkdir -p artifacts/mp3-files
          if [ -d "data/completed-tts/current" ] && [ "$(ls -A data/completed-tts/current 2>/dev/null)" ]; then
            cp data/completed-tts/current/*.mp3 artifacts/mp3-files/ 2>/dev/null || true
          fi

      - name: Upload TTS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-phase
          path: artifacts
          if-no-files-found: warn

      - name: Summarize TTS output
        if: success()
        run: |
          if [ -f artifacts/tts-output.json ]; then
            jq '.' artifacts/tts-output.json || cat artifacts/tts-output.json
          else
            echo "tts-output.json not produced."
          fi
