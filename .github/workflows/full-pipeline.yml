name: Full Pipeline

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: "Discovery lookback window (default: 7)"
        required: false
        default: "7"
      phase_limit:
        description: "Stop after phase (discovery, audio, scoring, digest, tts, publishing)"
        required: false
        default: "publishing"

concurrency:
  group: full-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-pipeline:
    name: Run Full Pipeline
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    env:
      PYTHON_VERSION: "3.11"
      VENV_PATH: .venv
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_REPOSITORY: ${{ secrets.GH_REPOSITORY }}
      DAYS_BACK: ${{ inputs.days_back }}
      PHASE_LIMIT: ${{ inputs.phase_limit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git for commits
        run: |
          git config --global user.name "Paul Brown"
          git config --global user.email "brownpr0@gmail.com"

      - name: Ensure required secrets present
        run: |
          missing=()
          for var in DATABASE_URL OPENAI_API_KEY ELEVENLABS_API_KEY GITHUB_TOKEN GITHUB_REPOSITORY; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            pip-${{ runner.os }}-

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            venv-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [ ! -d "${VENV_PATH}" ]; then
            python -m venv "${VENV_PATH}"
          fi
          source "${VENV_PATH}/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Full Pipeline Orchestrator
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          source "${VENV_PATH}/bin/activate"

          echo "=== Running Full Pipeline Orchestrator ==="
          echo "Target branch: $TARGET_BRANCH"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Days back: $DAYS_BACK"
          echo "Phase limit: $PHASE_LIMIT"

          if [ "$PHASE_LIMIT" = "publishing" ]; then
            python run_full_pipeline_orchestrator.py --verbose
          else
            python run_full_pipeline_orchestrator.py --phase "$PHASE_LIMIT" --verbose
          fi

      - name: Commit and push changes
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          source "${VENV_PATH}/bin/activate"

          echo "=== Checking for changes to commit ==="
          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes to commit after pipeline run."
          else
            echo "=== Committing pipeline updates ==="
            COMMIT_MSG="Pipeline run completed - $(date -u +'%Y-%m-%d %H:%M:%S')"
            git commit -m "$COMMIT_MSG"

            echo "=== Pushing changes ==="
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TARGET_BRANCH"

            echo "✅ Pipeline changes pushed successfully"
          fi

      - name: Verify deployment
        run: |
          echo "=== Verifying deployment ==="
          echo "RSS feed should be available at: https://podcast.paulrbrown.org/daily-digest.xml"

          # Give Vercel time to deploy
          sleep 30

          # Check if RSS contains recent episodes
          curl -s https://podcast.paulrbrown.org/daily-digest.xml | head -20