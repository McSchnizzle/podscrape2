name: Phase Digest

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum episodes to include (overrides web config)"
        required: false
        default: ""
      days_back:
        description: "Discovery lookback window (overrides web config)"
        required: false
        default: ""

concurrency:
  group: phase-digest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  digest:
    name: Run Digest Phase (Dry Run)
    runs-on: ubuntu-latest

    env:
      PYTHON_VERSION: "3.11"
      VENV_PATH: .venv
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_REPOSITORY: ${{ secrets.GH_REPOSITORY }}
      LIMIT: ${{ inputs.limit }}
      DAYS_BACK: ${{ inputs.days_back }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure required secrets present
        run: |
          missing=()
          for var in DATABASE_URL OPENAI_API_KEY GH_TOKEN GH_REPOSITORY; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            pip-${{ runner.os }}-

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            venv-${{ runner.os }}-

      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/whisper
            ~/.cache/torch
          key: whisper-${{ runner.os }}-${{ env.PYTHON_VERSION }}
          restore-keys: |
            whisper-${{ runner.os }}-

      - name: Install dependencies
        run: |
          if [ ! -d "${VENV_PATH}" ]; then
            python -m venv "${VENV_PATH}"
          fi
          source "${VENV_PATH}/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run discovery dry run (seed data)
        run: |
          source "${VENV_PATH}/bin/activate"
          mkdir -p artifacts

          # Build discovery command with web config parameters
          DISCOVERY_CMD="python scripts/run_discovery.py --dry-run --verbose --output artifacts/discovery-output.json"

          # Add optional override parameters if provided
          if [ -n "$LIMIT" ]; then
            DISCOVERY_CMD="$DISCOVERY_CMD --limit \"$LIMIT\""
          fi
          if [ -n "$DAYS_BACK" ]; then
            DISCOVERY_CMD="$DISCOVERY_CMD --days-back \"$DAYS_BACK\""
          fi

          echo "Running: $DISCOVERY_CMD"
          eval "$DISCOVERY_CMD"
        env:
          ORCHESTRATED_EXECUTION: "1"

      - name: Run audio dry run (seed transcripts table)
        run: |
          source "${VENV_PATH}/bin/activate"
          mkdir -p artifacts

          # Build audio command with web config parameters
          AUDIO_CMD="python scripts/run_audio.py --dry-run --verbose --output artifacts/audio-output.json"

          # Add optional override parameters if provided
          if [ -n "$LIMIT" ]; then
            AUDIO_CMD="$AUDIO_CMD --limit \"$LIMIT\""
          fi

          echo "Running: $AUDIO_CMD"
          eval "$AUDIO_CMD < artifacts/discovery-output.json"
        env:
          ORCHESTRATED_EXECUTION: "1"

      - name: Run scoring dry run (seed scoring table)
        run: |
          source "${VENV_PATH}/bin/activate"
          mkdir -p artifacts

          # Build scoring command with web config parameters
          SCORING_CMD="python scripts/run_scoring.py --dry-run --verbose --output artifacts/scoring-output.json"

          # Add optional override parameters if provided
          if [ -n "$LIMIT" ]; then
            SCORING_CMD="$SCORING_CMD --limit \"$LIMIT\""
          fi

          echo "Running: $SCORING_CMD"
          eval "$SCORING_CMD < artifacts/audio-output.json"
        env:
          ORCHESTRATED_EXECUTION: "1"

      - name: Run digest dry run
        run: |
          source "${VENV_PATH}/bin/activate"
          mkdir -p artifacts
          python scripts/run_digest.py \
            --dry-run \
            --verbose \
            --output artifacts/digest-output.json
        env:
          ORCHESTRATED_EXECUTION: "1"

      - name: Collect digest logs
        if: always()
        run: |
          mkdir -p artifacts/logs
          for pattern in "logs/digest_*.log" "logs/scoring_*.log" "logs/audio_*.log" "logs/discovery_*.log"; do
            if compgen -G "$pattern" > /dev/null; then
              cp $pattern artifacts/logs/
            fi
          done

      - name: Upload digest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-phase
          path: artifacts
          if-no-files-found: warn

      - name: Summarize digest output
        if: success()
        run: |
          if [ -f artifacts/digest-output.json ]; then
            jq '.' artifacts/digest-output.json || cat artifacts/digest-output.json
          else
            echo "digest-output.json not produced."
          fi
